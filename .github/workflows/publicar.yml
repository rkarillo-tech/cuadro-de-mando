# Al publicar una Release (p. ej. v1.0.0) desde la web de GitHub, construye CuadroDeMando.html
# y lo adjunta a esa Release como archivo descargable.
name: Adjuntar el HTML a la versión
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Comprobar que la etiqueta coincide con VERSION
        run: test "v$(cat VERSION)" = "${{ github.event.release.tag_name }}"
      - name: Construir el HTML
        run: python3 build.py
      - name: Adjuntar a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" CuadroDeMando.html --clobber
