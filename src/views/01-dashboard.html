    <!-- ===================== INICIO ===================== -->
    <section class="view" id="view-dashboard">
      <div id="dashNotices"></div>
      <div class="stats" id="dashStats"></div>
      <div class="dash-grid">
        <div class="card">
          <div class="card-h"><h3>☑️ Para hoy</h3><button class="btn sm ghost" data-goto="todos">Ver tareas →</button></div>
          <div class="list" id="dashToday"></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>📅 Agenda · 7 días</h3><button class="btn sm ghost" data-goto="calendar">Calendario →</button></div>
          <div class="list" id="dashAgenda"></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>⚡ Captura rápida</h3><span class="muted small"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> = tarea</span></div>
          <textarea class="field" id="quickText" rows="4" placeholder="Una idea, un recordatorio o una tarea… (p. ej. «Llamar a Ana mañana #trabajo !»)"></textarea>
          <div class="row" style="margin-top:10px;justify-content:flex-end">
            <button class="btn" id="quickNoteBtn">📝 Nota</button>
            <button class="btn" id="quickKanbanBtn">📋 Kanban</button>
            <button class="btn primary" id="quickTodoBtn">☑️ Tarea</button>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>🔁 Hábitos de hoy</h3><button class="btn sm ghost" data-goto="habits">Ver hábitos →</button></div>
          <div class="list" id="dashHabits"></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>🍅 Foco · últimos 7 días</h3><span class="muted small" id="dashFocusTotal"></span></div>
          <div class="bars" id="dashBars"></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>📋 Kanban · próximas</h3><button class="btn sm ghost" data-goto="kanban">Ver tablero →</button></div>
          <div class="list" id="dashTasks"></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>🏷️ Etiquetas</h3><button class="btn sm ghost" data-goto="tags">Ver todas →</button></div>
          <div id="dashTags"></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>📝 Notas recientes</h3><button class="btn sm ghost" data-goto="notes">Ver todas →</button></div>
          <div class="list" id="dashNotes"></div>
        </div>
      </div>
    </section>
