    <!-- ===================== KANBAN ===================== -->
    <section class="view" id="view-kanban">
      <div class="kb-toolbar">
        <input class="field" id="kbSearch" placeholder="🔍 Filtrar por texto o #etiqueta…" style="max-width:300px">
        <select class="field" id="kbPriority" style="max-width:190px">
          <option value="">Todas las prioridades</option>
          <option value="alta">Prioridad alta</option>
          <option value="media">Prioridad media</option>
          <option value="baja">Prioridad baja</option>

          <button data-d="normal" class="on">▫ Normal</button>
          <button data-d="full" title="Descripción completa y subtareas desplegadas">▤ Detalle</button>
        </div>
        <button class="btn primary" id="kbNewBtn">＋ Nueva tarea</button>
      </div>
      <div class="kb-board" id="kbBoard"></div>
