    <!-- ===================== ETIQUETAS ===================== -->
    <section class="view" id="view-tags">
      <div class="tags-layout">
        <div class="card">
          <div class="card-h"><h3>☁️ Nube de etiquetas</h3>
            <div class="seg" id="tgSort"><button data-s="count" class="on">Más usadas</button><button data-s="az">A → Z</button></div>
          </div>
          <input class="field" id="tgSearch" placeholder="🔍 Buscar etiqueta…" style="margin-bottom:10px">
          <div class="tag-cloud" id="tgCloud"></div>
          <p class="hint">Escribe <b>#etiqueta</b> en cualquier nota, tarea, tarjeta, evento, marcador o idea de un mapa (al teclear <kbd>#</kbd> te sugiere las que ya usas). Con <b>/</b> puedes crear niveles: <code>#proyecto/portal</code> también aparece en <code>#proyecto</code>. Mayúsculas y tildes no cuentan: <code>#Reunión</code> = <code>#reunion</code>.</p>
        </div>
        <div class="card" id="tgDetail"></div>
      </div>
    </section>
